<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vampi Tattoo | Галерея работ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="icon" href="pictures/title.png">
    <style>
        /* Стили для страницы галереи */
        body.gallery-page {
            background: url(pictures/фон.jpg) no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 100px auto 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .gallery-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .gallery-title {
            font-family: "UnifrakturMaguntia";
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(255, 0, 0, 0.5);
            margin-bottom: 10px;
        }
        
        .gallery-subtitle {
            color: #aaa;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        
        /* Стили для фильтров */
        .style-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 40px;
            padding: 0 20px;
        }
        
        .style-btn {
            padding: 12px 25px;
            background: rgba(255, 50, 50, 0.3);
            color: #fff;
            border: 1px solid #ff3333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .style-btn.active {
            background: rgba(255, 50, 50, 0.7);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
        }
        
        .style-btn:hover {
            background: rgba(255, 50, 50, 0.5);
            transform: translateY(-2px);
        }
        
        /* Сетка галереи */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
            aspect-ratio: 1/1;
            transition: all 0.4s ease;
            border: 2px solid rgba(255, 51, 51, 0.3);
        }
        
        .gallery-item:hover {
            transform: scale(1.03);
            border-color: #ff3333;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .gallery-item:hover .item-overlay {
            opacity: 1;
        }
        
        .item-title {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .item-style {
            color: #ff3333;
            font-size: 0.9rem;
        }
        
        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            position: relative;
        }
        
        .modal-img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }
        
        .modal-info {
            text-align: center;
            margin-top: 15px;
            color: #fff;
        }
        
        .modal-title {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #ff3333;
        }
        
        .modal-style {
            font-size: 1rem;
            color: #aaa;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            color: #fff;
            background: rgba(255, 0, 0, 0.3);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2001;
        }
        
        .close-modal:hover {
            background: rgba(255, 0, 0, 0.6);
            transform: rotate(90deg);
        }
        
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 0, 0, 0.3);
            border: none;
            color: white;
            font-size: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2001;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .nav-btn:hover {
            background: rgba(255, 0, 0, 0.6);
        }
        
        .prev-btn-modal {
            left: 20px;
        }
        
        .next-btn-modal {
            right: 20px;
        }
        
        .no-items {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #aaa;
            font-size: 1.2rem;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 0, 0, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #ff3333;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .back-button:hover {
            background: rgba(255, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        
        .button-container {
            text-align: center;
            margin-top: 30px;
        }
        
        /* Адаптивность */
        @media (max-width: 768px) {
            .gallery-container {
                margin: 120px 20px 40px;
                padding: 15px;
            }
            
            .gallery-title {
                font-size: 2.5rem;
            }
            
            .style-filters {
                gap: 10px;
            }
            
            .style-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }
            
            .nav-btn {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .close-modal {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .gallery-container {
                margin: 100px 5vw 40px;
                margin-left: -5vw;
            }
            
            .gallery-title {
                font-size: 2rem;
            }
            
            .style-filters {
                flex-direction: column;
                align-items: center;
            }
            
            .style-btn {
                width: 100%;
                max-width: 250px;
                text-align: center;
            }
            
            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            
            .modal-title {
                font-size: 1.2rem;
            }
        }

        /* Исправления для header на странице галереи */
        .gallery-page header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: linear-gradient(to bottom, black 0%, black 50%, rgba(0,0,0,0.8) 75%, rgba(0,0,0,0) 100%);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            height: 5vw;
        }

        .gallery-page .burger-menu {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1002;
        }

        .gallery-page .tg-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .gallery-page .tg-button,
            .gallery-page .burger-menu {
                position: fixed;
                top: 15px;
            }

            .gallery-page .tg-button {
                right: 15px;
            }

            .gallery-page .burger-menu {
                left: 15px;
            }

            .gallery-page .burger-icon {
                font-size: 1rem;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body class="gallery-page">
    <header>
        <h1 class="animate__animated animate__fadeInDown">Vampi Tattoo</h1>
        
        <!-- Бургер меню -->
        <div class="burger-menu">
            <div class="burger-icon">☰</div>
            <nav class="burger-nav">
                <a href="index.html">Главная страница</a>
                <a href="aftercare.html">Уход за татуировкой</a>
                <a href="https://t.me/vampi_tattoo" target="_blank">Мой Telegram канал</a>
            </nav>
        </div>

        <a href="https://t.me/qtvampp?text=Здравствуйте!%20Хочу%20записаться%20на%20татуировку." class="tg-button" target="_blank">
            <button class="animate-button">Записаться</button>
        </a>
    </header>

    <div class="container">
        <div class="gallery-container animate__animated animate__fadeIn">
            <div class="gallery-header">
                <h2 class="gallery-title">Галерея работ</h2>
                <p class="gallery-subtitle">Выберите стиль, чтобы увидеть работ в этом направлении</p>
            </div>
            
            <!-- Фильтры по стилям -->
            <div class="style-filters">
                <button class="style-btn active" data-filter="all">Все работы</button>
                <button class="style-btn" data-filter="mini">Минитату</button>
                <button class="style-btn" data-filter="neotrable">Неотрайбл</button>
                <button class="style-btn" data-filter="realism">Реализм</button>
                <button class="style-btn" data-filter="air">Воздушные</button>
            </div>
            
            <!-- Сетка галереи -->
            <div class="gallery-grid" id="gallery-grid">
                <!-- Элементы галереи будут добавляться через JavaScript -->
            </div>
            
            <div class="button-container">
                <a href="index.html" class="back-button">Вернуться на главную</a>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="image-modal">
        <button class="close-modal" id="close-modal">×</button>
        <button class="nav-btn prev-btn-modal" id="prev-btn">‹</button>
        <button class="nav-btn next-btn-modal" id="next-btn">›</button>
        
        <div class="modal-content">
            <img src="" alt="" class="modal-img" id="modal-img">
            <div class="modal-info">
                <h3 class="modal-title" id="modal-title"></h3>
                <p class="modal-style" id="modal-style"></p>
            </div>
        </div>
    </div>

    <div class="ink-drops"></div>

    <script>
        // Данные галереи
        const galleryData = [
            { 
                src: "pictures/пример1.jpg", 
                title: "реализм", 
                style: "realism",
                desc: "реализм"
            },
            { 
                src: "pictures/пример2.jpg", 
                title: "минитату", 
                style: "mini",
                desc: "минитату"
            },
            { 
                src: "pictures/пример3.jpg", 
                title: "минитату", 
                style: "mini",
                desc: "минитату"
            },
            { 
                src: "pictures/пример4.jpg", 
                title: "реализм", 
                style: "realism",
                desc: "реализм"
            },
            { 
                src: "pictures/пример6.jpg", 
                title: "реализм", 
                style: "realism",
                desc: "реализм"
            },
            { 
                src: "pictures/пример7.jpg", 
                title: "воздушные", 
                style: "air",
                desc: "воздушные"
            },
            { 
                src: "pictures/пример8.jpg", 
                title: "неотрайбл", 
                style: "neotrable",
                desc: "неотрайбл"
            },
        ];

        // Инициализация галереи
        document.addEventListener('DOMContentLoaded', function() {
            const galleryGrid = document.getElementById('gallery-grid');
            const filterButtons = document.querySelectorAll('.style-btn');
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalTitle = document.getElementById('modal-title');
            const modalStyle = document.getElementById('modal-style');
            const closeModal = document.getElementById('close-modal');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            let currentFilter = 'all';
            let currentItems = [];
            let currentIndex = 0;
            
            // Заполняем галерею
            function renderGallery(filter = 'all') {
                galleryGrid.innerHTML = '';
                currentItems = filter === 'all' ? galleryData : galleryData.filter(item => item.style === filter);
                
                if (currentItems.length === 0) {
                    galleryGrid.innerHTML = '<div class="no-items">Работ в этом стиле пока нет</div>';
                    return;
                }
                
                currentItems.forEach((item, index) => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.dataset.index = index;
                    galleryItem.innerHTML = `
                        <img src="${item.src}" alt="${item.title}">
                        <div class="item-overlay">
                            <h3 class="item-title">${item.title}</h3>
                            <p class="item-style">${getStyleName(item.style)}</p>
                        </div>
                    `;
                    
                    galleryItem.addEventListener('click', () => openModal(index));
                    galleryGrid.appendChild(galleryItem);
                });
            }
            
            // Получаем русское название стиля
            function getStyleName(style) {
                const styles = {
                    'all': 'Все стили',
                    'mini': 'Минитату',
                    'realism': 'Реализм',
                    'air': 'воздушные',
                    'neotrable': 'неотрайбл'
                };
                return styles[style] || style;
            }
            
            // Открытие модального окна
            function openModal(index) {
                currentIndex = index;
                const item = currentItems[index];
                
                modalImg.src = item.src;
                modalImg.alt = item.title;
                modalTitle.textContent = item.title;
                modalStyle.textContent = getStyleName(item.style);
                
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            
            // Закрытие модального окна
            function closeModalFunc() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
            
            // Навигация по модальному окну
            function navigateModal(direction) {
                currentIndex = (currentIndex + direction + currentItems.length) % currentItems.length;
                openModal(currentIndex);
            }
            
            // Обработчики для фильтров
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentFilter = this.dataset.filter;
                    renderGallery(currentFilter);
                });
            });
            
            // Обработчики для модального окна
            closeModal.addEventListener('click', closeModalFunc);
            prevBtn.addEventListener('click', () => navigateModal(-1));
            nextBtn.addEventListener('click', () => navigateModal(1));
            
            // Закрытие по клику вне изображения
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModalFunc();
                }
            });
            
            // Закрытие по ESC
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && modal.classList.contains('active')) {
                    closeModalFunc();
                }
                if (e.key === 'ArrowLeft' && modal.classList.contains('active')) {
                    navigateModal(-1);
                }
                if (e.key === 'ArrowRight' && modal.classList.contains('active')) {
                    navigateModal(1);
                }
            });
            
            // Инициализация
            renderGallery();
            createInkDrops();
            initBurgerMenu();
        });
        initBurgerMenu();
    </script>
</body>
</html>
